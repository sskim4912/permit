name: Publish isolated gate map preview
on:
  push:
    branches: [gate-map-preview]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: permit-daesan-461e8
      - name: Publish preview channel only
        run: |
          npx --no-install firebase hosting:channel:deploy gate-map-preview --expires 7d --config preview/firebase.json --project permit-daesan-461e8 --non-interactive --json > /tmp/preview-result.json
          node - <<'JS'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/preview-result.json','utf8'));
          function find(x) {
            if (typeof x === 'string' && /^https:\/\/permit-daesan-461e8--gate-map-preview[^/]*\.web\.app/.test(x)) return x;
            if (x && typeof x === 'object') for (const v of Object.values(x)) { const u=find(v); if(u) return u; }
          }
          const url = find(data); if (!url) throw Error('Preview URL missing');
          fs.writeFileSync('preview-url.txt',url+'\n');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-url.txt
          git diff --cached --quiet || git commit -m 'Record isolated preview URL [skip ci]'
          git push origin HEAD:gate-map-preview
