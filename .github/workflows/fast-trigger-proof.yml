name: Verify fast trigger ownership proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/fast-trigger-proof.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: permit-firebase-setup
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --prefix functions
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: permit-daesan-461e8
      - run: node functions/fast-trigger-probe.js
