name: Test and deploy Firebase

on:
  push:
    branches: [main, permit-firebase-setup]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: node --test tests/hosting.test.js
      - name: Test Firebase authentication and Firestore rules locally
        shell: bash
        run: |
          set +e
          npm test > /tmp/firebase-test-output.log 2>&1
          test_status=$?
          set -e
          cat /tmp/firebase-test-output.log
          python3 - <<'PYTHON'
          import html, os, re
          from pathlib import Path
          output = Path('/tmp/firebase-test-output.log').read_text(errors='replace')
          output = re.sub(r'\x1b\[[0-9;]*m', '', output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Firebase emulator test results\n<pre>' + html.escape(output[-18000:]) + '</pre>\n')
          PYTHON
          exit "$test_status"
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      - name: Stamp deployment commit
        run: node -e "require('fs').writeFileSync('public/deployment.json', JSON.stringify({commit:process.env.GITHUB_SHA}))"
      - uses: actions/upload-artifact@v6
        with:
          name: firebase-site
          path: public/
          retention-days: 7

  deploy:
    name: Publish website and Firestore rules
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check deployment credential is connected
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::Deployment credential is missing. In sskim4912/permit, open Settings > Secrets and variables > Actions > Repository secrets and save FIREBASE_SERVICE_ACCOUNT (exact name, no spaces). Then re-run all jobs.'
            exit 1
          fi
          python3 - <<'PYTHON'
          import json, os, sys
          try:
              key = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
              valid = (key.get('type') == 'service_account'
                       and key.get('project_id') == 'permit-daesan-461e8'
                       and bool(key.get('client_email'))
                       and bool(key.get('private_key')))
              if not valid:
                  raise ValueError()
          except (ValueError, TypeError, AttributeError):
              print('::error::FIREBASE_SERVICE_ACCOUNT must contain the complete service-account JSON for permit-daesan-461e8. Update the GitHub secret; never paste the key into logs or chat.')
              sys.exit(1)
          print('Deployment credential format and target project verified.')
          PYTHON
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v6
        with:
          name: firebase-site
          path: public/
      - name: Authenticate to the permit Firebase project
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: permit-daesan-461e8
      - name: Deploy tested website and access rules
        run: npx --no-install firebase deploy --only hosting,firestore:rules --project permit-daesan-461e8 --non-interactive
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      - name: Check published homepage
        run: |
          node scripts/verify-hosting.mjs
          echo 'Published: https://permit-daesan-461e8.web.app' >> "$GITHUB_STEP_SUMMARY"
