name: Test and deploy Firebase

on:
  push:
    branches: [main, permit-firebase-setup]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - name: Test Firebase authentication and Firestore rules locally
        run: npm test
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-site
          path: public/
          retention-days: 7

  deploy:
    name: Publish website and Firestore rules
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credential is connected
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::Add the FIREBASE_SERVICE_ACCOUNT repository secret using the steps in DEPLOY.md, then re-run this workflow.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: firebase-site
          path: public/
      - name: Authenticate to the permit Firebase project
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: permit-daesan-461e8
      - name: Deploy tested website and access rules
        run: npx --no-install firebase deploy --only hosting,firestore:rules --project permit-daesan-461e8 --non-interactive
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      - name: Check published homepage
        run: |
          curl --fail --retry 3 --retry-delay 5 --silent --show-error https://permit-daesan-461e8.web.app/ -o /tmp/permit-home.html
          grep -q '대산 출입관리' /tmp/permit-home.html
          echo 'Published: https://permit-daesan-461e8.web.app' >> "$GITHUB_STEP_SUMMARY"
