name: Send queued permit notifications
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Test and deploy Firebase]
    types: [completed]
    branches: [permit-firebase-setup]
  push:
    branches: [main]
    paths: [.github/workflows/notify-queue.yml]
permissions:
  contents: read
concurrency:
  group: permit-notification-queue
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: permit-firebase-setup
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: permit-daesan-461e8
      - name: Verify provider connection and send only queued new submissions
        env:
          PERMIT_NOTIFICATION_CONFIG: ${{ secrets.PERMIT_NOTIFICATION_CONFIG }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node functions/worker.js --check-solapi
          else
            node functions/worker.js
          fi
