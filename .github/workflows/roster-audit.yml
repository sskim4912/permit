name: Inspect roster date coverage
on:
  workflow_dispatch:
    inputs:
      visit_date:
        description: Visit date to inspect (YYYY-MM-DD)
        required: true
        default: '2026-11-04'
  push:
    branches: [main]
    paths: [.github/workflows/roster-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: permit-firebase-setup
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: permit-daesan-461e8
      - name: Read date and status counts without modifying applications
        env:
          VISIT_DATE: ${{ inputs.visit_date || '2026-11-04' }}
        run: node functions/roster-audit.js "$VISIT_DATE"
