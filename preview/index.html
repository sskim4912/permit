<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>출입위치 지도 · 미리보기</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f7;color:#20393c;font:16px system-ui,sans-serif}header{background:white;padding:18px 5%;display:flex;align-items:center;justify-content:space-between}header img{width:150px}main{max-width:1300px;margin:30px auto;padding:0 20px}.notice{padding:14px;background:#fff3d9;border-radius:8px}h1{font-size:28px}section{background:white;border:1px solid #dce5e4;border-radius:12px;padding:24px;margin:22px 0}.visitor{border:1px solid #dce5e4;border-radius:8px;padding:18px;margin:14px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}label{font-size:13px;color:#667e7d;display:block}input,select{display:block;width:100%;font-family:inherit;font-size:16px;padding:12px;border:1px solid #cddcda;border-radius:6px;margin-top:8px;background:white;color:#20393c}.map{display:inline-block;padding:10px 12px;border:1px solid #13836d;border-radius:6px;color:#087c68;text-decoration:none;margin-top:10px;font-size:14px}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px}button{padding:12px 18px;border:1px solid #d0dfdd;border-radius:6px;background:white;font:inherit}.primary{background:#128069;color:white}.table{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{padding:16px;text-align:left;border-bottom:1px solid #e6eceb;font-size:14px}th{background:#f4f7f7}.status{color:#ac641a;background:#fff0db;padding:5px 10px;border-radius:20px}.hint{color:#748a87;font-size:13px}@media(max-width:650px){main{padding:0 12px}section{padding:16px}.visitor{grid-template-columns:1fr 1fr;padding:12px;gap:14px}h1{font-size:23px}header{padding:14px}header img{width:125px}.table table,.table tbody,.table tr,.table td{display:block;white-space:normal}.table thead{display:none}.table tr{border:1px solid #dce5e4;border-radius:8px;margin:12px 0;padding:8px}.table td{border:0;padding:8px}.table td:before{content:attr(data-label);display:inline-block;width:82px;color:#748a87}}
</style><header><img src="gs-logo.png" alt="GS건설"><span>🛡 관리자 접속</span></header><main><p class="notice">화면 협의용 미리보기 · 운영 사이트 및 실제 신청 데이터와 연결되지 않습니다.</p><h1>출입신청, 한 화면에서 쉽게 처리하세요.</h1><section><h2>방문자 입력</h2><p class="hint">배치 확인을 위해 일부 항목만 표시했습니다. 출입위치를 바꾸면 지도 버튼도 바뀝니다.</p><div id="visitors"></div><div class="actions"><span class="hint">가상 방문자 예시</span><button class="primary" onclick="document.getElementById('feedback').textContent='미리보기입니다. 실제 신청은 저장되지 않습니다.'">신청하기 →</button></div><p id="feedback" aria-live="polite"></p></section><section><h2>저장된 신청 목록</h2><div class="table"><table><thead><tr><th>이름</th><th>방문일자</th><th>출입위치</th><th>진행 상태</th></tr></thead><tbody id="saved"></tbody></table></div></section></main><script>
const west='https://map.naver.com/p/entry/place/17582772?c=17.78,0,0,0,adh&placePath=%2Fhome%3Ffrom%3Dmap%26fromPanelNum%3D1%26additionalHeight%3D76%26timestamp%3D202610151451%26locale%3Dko%26svcName%3Dmap_pcv5&isMini=true&p=RkjlGo4WdTrAj-bgqElgnA,7.87,10,80,Float';
const main='https://map.naver.com/p/search/LG%20%ED%99%94%ED%95%99%20%EB%8C%80%EC%82%B0%EA%B3%B5%EC%9E%A5%20%EC%A0%95%EB%AC%B8?c=17.78,0,0,0,adh&p=B5sA_WuAASG1hIza1eSF9w,-10.97,-8.49,80,Float&isMini=true&placePath=%2Fhome%3Ffrom%3Dmap%26fromPanelNum%3D1%26additionalHeight%3D76%26timestamp%3D202610151456%26locale%3Dko%26svcName%3Dmap_pcv5%26searchText%3DLG%20%ED%99%94%ED%95%99%20%EB%8C%80%EC%82%B0%EA%B3%B5%EC%9E%A5%20%EC%A0%95%EB%AC%B8';
function link(g,label){return `<a class="map" href="${g==='서문'?west:main}" target="_blank" rel="noopener noreferrer">📍 ${label||g+' 지도 보기'} ↗</a>`}
const data=[['홍길동','서문'],['김민수','정문 [VIP]']];
document.getElementById('visitors').innerHTML=data.map(([n,g])=>`<div class="visitor"><label>이름<input value="${n}"></label><label>방문일자<input type="date" value="2026-10-16"></label><label>방문목적<input value="회의 참석"></label><label>출입위치<select onchange="this.nextElementSibling.outerHTML=link(this.value)"><option ${g==='서문'?'selected':''}>서문</option><option ${g!=='서문'?'selected':''}>정문 [VIP]</option></select>${link(g)}</label></div>`).join('');
document.getElementById('saved').innerHTML=data.map(([n,g])=>`<tr><td data-label="이름">${n}</td><td data-label="방문일자">2026-10-16</td><td data-label="출입위치">${g} ${link(g,'지도 보기')}</td><td data-label="진행 상태"><span class="status">승인 대기</span></td></tr>`).join('');
</script></html>
